<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}disqo jobs{% endblock %}</title>
<style>
/* Bundled, not fetched: the app promises nothing leaves your machine. */
@font-face { font-family:"Archivo Black"; src:url("/static/fonts/ArchivoBlack-400.woff2") format("woff2");
  font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:"Inter Tight"; src:url("/static/fonts/InterTight-400.woff2") format("woff2");
  font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:"Inter Tight"; src:url("/static/fonts/InterTight-500.woff2") format("woff2");
  font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:"Inter Tight"; src:url("/static/fonts/InterTight-600.woff2") format("woff2");
  font-weight:600; font-style:normal; font-display:swap; }
@font-face { font-family:"JetBrains Mono"; src:url("/static/fonts/JetBrainsMono-400.woff2") format("woff2");
  font-weight:400 500; font-style:normal; font-display:swap; }

/* Shares the interview-prep page's design system: same OKLCH ramp, same
   restrained accent, same light/dark handling. Keep the two in step. */
:root {
  /* Matched to disquedoesit.com: near-white page, white cards, black borders,
     sharp corners, and one amber marker. The amber is 2.05:1 on white, so it
     never carries text — it fills, with near-black on top. */
  --brand-amber: #F9A300;
  --bg:        #FAFAF9;
  --surface:   #FFFFFF;
  --surface-2: #ECEBE7;
  --line:      #0B0B0B;
  --line-soft: #DEDCD6;
  --ink:       #0B0B0B;
  --ink-2:     #2A2A29;
  --muted:     #484848;
  --accent:    #8A5A00;
  --accent-ink:#8A5A00;
  --accent-bg: #FDECC8;
  --on-accent: #0B0B0B;
  --btn-bg:    #0B0B0B;
  --btn-ink:   #FAFAF9;
  --ok:        #1F6B45;
  --ok-bg:     #DFF0E6;
  --warn:      #8A5A00;
  --warn-bg:   #FDECC8;
  --danger:    #9B2C2C;
  --danger-bg: #FADBD8;
  --radius: 4px; --radius-sm: 3px;
  --sans: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Archivo Black", "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --dur: 180ms;
  --shadow-1: 0 1px 0 rgba(11, 11, 11, 0.06);

}
:root[data-theme="dark"] {
  --brand-amber: #F9A300;
  --bg:        #0E0E0D;
  --surface:   #171716;
  --surface-2: #201F1D;
  --line:      #3A3936;
  --line-soft: #2A2926;
  --ink:       #F5F4F1;
  --ink-2:     #D6D4CE;
  --muted:     #A8A6A0;
  --accent:    #F9A300;
  --accent-ink:#F9A300;
  --accent-bg: #3A2A08;
  --on-accent: #0B0B0B;
  --btn-bg:    #F5F4F1;
  --btn-ink:   #0E0E0D;
  --ok:        #7BC49B;
  --ok-bg:     #14301F;
  --warn:      #F0B860;
  --warn-bg:   #33260A;
  --danger:    #E89A96;
  --danger-bg: #341A19;

}
* { box-sizing: border-box; }
body { margin:0; font-family:var(--sans); font-size:16px; line-height:1.55;
       color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
h1,h2,h3 { margin:0; font-weight:650; letter-spacing:-0.011em; text-wrap:balance; }
p { margin:0; }
a { color:var(--accent-ink); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
code { font-family:var(--mono); font-size:0.88em; background:var(--surface-2);
       padding:1px 5px; border-radius:4px; }

.topbar { position:sticky; top:0; z-index:300;
  background:color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.topbar-inner { max-width:1180px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:baseline; gap:10px; margin-right:auto; }
.brand-name { font-size:0.95rem; font-weight:650; white-space:nowrap; }
.navlinks { display:flex; gap:2px; }
.navlinks a { padding:5px 10px; border-radius:var(--radius-sm); font-size:0.86rem;
  font-weight:550; color:var(--ink-2); }
.navlinks a:hover { background:var(--surface-2); color:var(--ink); text-decoration:none; }
.navlinks a.is-current { background:var(--accent-bg); color:var(--accent-ink); font-weight:650; }

.search-wrap { position:relative; flex:1 1 220px; max-width:340px; }
.search { width:100%; padding:7px 10px 7px 32px; font-size:0.88rem; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.search::placeholder { color:var(--muted); }
.search:focus { outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; color:var(--muted); pointer-events:none; }

.iconbtn { display:inline-grid; place-items:center; width:28px; height:28px; padding:0;
  background:none; border:1px solid transparent; border-radius:var(--radius-sm);
  color:var(--muted); cursor:pointer;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease); }
.iconbtn:hover { background:var(--surface-2); color:var(--ink); }
.iconbtn svg { width:15px; height:15px; }

.wrap { max-width:1180px; margin:0 auto; padding:26px 20px 80px; }
.page-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
.page-title { font-size:1.5rem; }
.page-sub { font-size:0.88rem; color:var(--muted); margin-left:auto; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; }
.card h3 { font-size:1rem; margin-bottom:10px; }
.muted { color:var(--muted); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

table { width:100%; border-collapse:collapse; }
.tablecard { background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden; }
.tablecard .scroll { overflow-x:auto; }
th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-soft); }
thead th { font-size:0.72rem; font-weight:650; letter-spacing:0.03em; text-transform:uppercase;
  color:var(--muted); background:var(--surface-2); white-space:nowrap; }
tbody tr:last-child td { border-bottom:0; }
tbody tr { transition:background var(--dur) var(--ease); }
tbody tr:hover { background:var(--surface-2); }
tr.is-hidden { display:none; }

/* Sortable column headers */
th[data-sort] { cursor:pointer; user-select:none; white-space:nowrap;
  transition:color var(--dur) var(--ease); }
th[data-sort]:hover { color:var(--ink); }
th[data-sort]::after { content:"↕"; margin-left:5px; opacity:0.3; font-size:0.9em; }
th[data-sort][aria-sort="ascending"]::after { content:"↑"; opacity:1; color:var(--accent-ink); }
th[data-sort][aria-sort="descending"]::after { content:"↓"; opacity:1; color:var(--accent-ink); }
th[data-sort]:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.jobdate { white-space:nowrap; font-variant-numeric:tabular-nums; font-size:0.84rem;
  color:var(--ink-2); }
.jobdate.is-stale { color:var(--muted); opacity:0.72; }
.jobtitle { font-weight:600; color:var(--ink); }
.jobtitle:hover { color:var(--accent-ink); }

.fit { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700;
  font-size:0.95rem; }
.fit.hi { color:var(--ok); } .fit.lo { color:var(--warn); }

.pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.72rem;
  font-weight:650; background:var(--surface-2); color:var(--muted);
  border:1px solid var(--line-soft); white-space:nowrap; }
.pill.tone-ok   { background:var(--ok-bg);   color:var(--ok);   border-color:transparent; }
.pill.tone-warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.pill.tone-accent { background:var(--accent-bg); color:var(--accent-ink); border-color:transparent; }

button, .btn { font:inherit; font-size:0.84rem; font-weight:550; padding:7px 13px;
  border-radius:var(--radius-sm); border:1px solid transparent; cursor:pointer;
  background:var(--accent); color:var(--on-accent); display:inline-block;
  transition:filter var(--dur) var(--ease), background var(--dur) var(--ease); }
button:hover, .btn:hover { filter:brightness(1.08); text-decoration:none; }
.btn.secondary, button.secondary { background:var(--surface); color:var(--ink-2);
  border-color:var(--line); }
.btn.secondary:hover, button.secondary:hover { background:var(--surface-2); color:var(--ink); }
.btn.danger, button.danger { background:var(--danger-bg); color:var(--danger);
  border-color:color-mix(in oklab, var(--danger) 30%, transparent); }
.btn.tiny { padding:4px 9px; font-size:0.76rem; }
form.inline { display:inline; }

textarea { width:100%; min-height:230px; padding:12px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  font-family:var(--mono); font-size:13px; line-height:1.5; resize:vertical; }
textarea:focus { outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }

pre.posting { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:13px; max-height:320px; overflow:auto;
  font-size:0.82rem; line-height:1.6; color:var(--ink-2); margin:0; }

input[type="text"], input[type="date"], select {
  font:inherit; font-size:0.86rem; padding:6px 9px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  max-width:100%; }
input[type="text"]:focus, input[type="date"]:focus, select:focus {
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
.field { display:grid; gap:4px; }
.field > span { font-size:0.72rem; font-weight:650; letter-spacing:0.02em;
  text-transform:uppercase; color:var(--muted); }
.formgrid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); }
.formgrid .wide { grid-column:1 / -1; }
.print-only { display:none; }
.person { padding:14px; border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:10px; }
.person-head { display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:12px; }
/* Numbered by CSS so adding or removing a row renumbers the rest for free. */
#people { counter-reset:person; }
.person { counter-increment:person; }
.person-num { font-size:0.72rem; font-weight:650; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--muted); }
.person-num::before { content:"Interviewer " counter(person); }

/* Home: what to do next */
.nextgrid { display:grid; gap:14px; grid-template-columns:repeat(3, minmax(0, 1fr));
  margin-bottom:14px; }
@media (max-width: 1000px) { .nextgrid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
@media (max-width: 660px)  { .nextgrid { grid-template-columns:1fr; } }
.card.next { margin-bottom:0; }
/* Spans the row beneath the three summary cards. */
.card.next--wide { grid-column:1 / -1; }
.next--wide .widesplit { display:grid; gap:18px 28px; grid-template-columns:minmax(0, 1fr) minmax(0, 1.4fr);
  align-items:start; }
@media (max-width: 760px) { .next--wide .widesplit { grid-template-columns:1fr; } }
.nextlist { list-style:none; margin:10px 0 12px; padding:0; display:grid;
  gap:7px 14px; align-items:baseline; font-size:0.9rem; }
/* Rows contribute their cells to the list's own grid, so every company starts
   on the same plumb line instead of wherever its title happened to end. */
.nextlist li { display:contents; }
.nextlist--scored { grid-template-columns:minmax(0, 1fr) max-content max-content; }
.nextlist--plain  { grid-template-columns:minmax(0, 1fr) max-content; }
.nextlist .jobtitle { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nextlist .company { font-size:0.82rem; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.nextlist .fit { text-align:right; font-size:0.85rem; }
.weekcount { display:flex; align-items:baseline; gap:10px; padding:12px 14px;
  border-radius:var(--radius-sm); background:var(--surface-2); }
.weekcount.tone-ok { background:var(--ok-bg); }
.weekcount.tone-warn { background:var(--warn-bg); }
.weeknum { font-size:1.7rem; font-weight:700; letter-spacing:-0.02em; }
.pipeline { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); }
.pipeline a { display:grid; gap:2px; padding:12px; border:1px solid var(--line);
  border-radius:var(--radius-sm); text-align:center; color:var(--ink);
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.pipeline a:hover { border-color:var(--accent); background:var(--surface-2); text-decoration:none; }
.pipenum { font-size:1.35rem; font-weight:700; }
.pipelabel { font-size:0.76rem; color:var(--muted); }

/* Long-running work */
.progress { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.progress > span { display:block; height:100%; background:var(--accent); border-radius:999px;
  transition:width 400ms var(--ease); }
button[data-busy] { opacity:0.65; pointer-events:none; }
.statgrid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
.statgrid > div { display:grid; gap:2px; }
.statnum { font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; }
.statlabel { font-size:0.8rem; color:var(--muted); }
.prose-list { margin:10px 0; padding-left:20px; display:grid; gap:7px;
  color:var(--ink-2); font-size:0.87rem; }

/* Wizard + onboarding */
.wizard { max-width:780px; margin:0 auto; }
.steps { display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0 0 20px; padding:0;
  counter-reset:step; }
.steps li { counter-increment:step; font-size:0.78rem; font-weight:600; color:var(--muted);
  padding:5px 11px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--line-soft); }
.steps li::before { content:counter(step) ". "; opacity:0.65; }
.steps li.is-current { background:var(--accent-bg); color:var(--accent-ink);
  border-color:transparent; }
.note { padding:11px 14px; border-radius:var(--radius-sm); margin-bottom:16px;
  font-size:0.88rem; }
.note.tone-ok { background:var(--ok-bg); color:var(--ok); }
.note.tone-warn { background:var(--warn-bg); color:var(--warn); }
.choice { display:flex; gap:11px; align-items:flex-start; padding:14px;
  border:1px solid var(--line); border-radius:var(--radius); margin-top:10px;
  cursor:pointer; transition:border-color var(--dur) var(--ease),
  background var(--dur) var(--ease); }
.choice:hover { border-color:var(--accent); background:var(--surface-2); }
.choice input { margin-top:3px; }
.choice > span { display:grid; gap:4px; font-size:0.92rem; }
.choice .muted { font-size:0.85rem; }
.howto { margin:0; padding-left:20px; display:grid; gap:7px; color:var(--ink-2);
  font-size:0.9rem; }
.checkgrid { display:grid; gap:7px; margin-top:10px;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); }
.check { display:flex; gap:8px; align-items:center; font-size:0.88rem;
  padding:7px 10px; border:1px solid var(--line); border-radius:var(--radius-sm);
  cursor:pointer; }
.check:hover { background:var(--surface-2); border-color:var(--accent); }
.divider { display:flex; align-items:center; gap:12px; margin:22px 0;
  color:var(--muted); font-size:0.8rem; text-transform:uppercase;
  letter-spacing:0.05em; }
.divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
input[type="file"] { font-size:0.86rem; padding:8px; background:var(--bg);
  border:1px dashed var(--line); border-radius:var(--radius-sm); width:100%; }

.empty { padding:36px 18px; text-align:center; color:var(--muted); }
.hitcount { display:none; font-size:0.84rem; color:var(--muted); margin-bottom:12px; }
body.is-searching .hitcount { display:block; }


/* The raw brand teal reads as a fill, never as text on light surfaces. */
.pill.tone-brand { background:var(--brand-teal); color:#12333B; border-color:transparent; }
.fit.hi { color:var(--accent); }
.pipeline a:hover { border-color:var(--brand-teal); }
.progress > span { background:linear-gradient(90deg, var(--accent), var(--brand-teal)); }
.weekcount.tone-ok .weeknum { color:var(--ok); }
thead th { border-bottom:1px solid var(--line); }
.topbar { border-bottom:1px solid var(--line); }
.navlinks a.is-current { box-shadow:inset 0 -2px 0 var(--brand-teal); }


/* Cream marks things that want a second look, rather than tinting everything. */
.note.tone-warn, .weekcount.tone-warn { background:var(--brand-cream); color:var(--ink); }
.callout.tone-warn { background:var(--brand-cream); border-color:#E2CDB4; }


/* --- disquedoesit.com signature: heavy display type, hard black rules --- */
h1, h2, .page-title, .brand-name {
  font-family:var(--display); font-weight:400; letter-spacing:-0.02em;
  text-transform:none;
}
.page-title { font-size:1.6rem; line-height:1.12; }
h3, .card h3 { font-family:var(--sans); font-weight:600; letter-spacing:-0.005em; }
.fit, .jobdate, .statnum, .pipenum, .weeknum, .timer-display, code {
  font-family:var(--mono); font-variant-numeric:tabular-nums; }
.statnum, .pipenum, .weeknum { font-family:var(--display); font-weight:400; }

/* Containers get the full black rule; rows inside get a soft one, or a
   1,400-row table becomes a wall of lines. */
.card, .tablecard, .person, .resume { border:1px solid var(--line); }
th, td { border-bottom:1px solid var(--line-soft); }
thead th { border-bottom:1px solid var(--line); background:var(--surface-2);
  letter-spacing:0.04em; }
.topbar { border-bottom:1px solid var(--line); }

button, .btn { background:var(--btn-bg); color:var(--btn-ink);
  border:1px solid var(--line); border-radius:var(--radius-sm); font-weight:500; }
button:hover, .btn:hover { filter:none; background:var(--ink-2); }
.btn.secondary, button.secondary { background:var(--surface); color:var(--ink);
  border-color:var(--line); }
.btn.secondary:hover, button.secondary:hover { background:var(--surface-2); }
.btn.danger, button.danger { background:var(--danger-bg); color:var(--danger);
  border-color:var(--danger); }

/* The amber is a marker, exactly as the site uses it. */
.navlinks a.is-current { box-shadow:inset 0 -3px 0 var(--brand-amber); background:none;
  color:var(--ink); }
.pill.tone-accent { background:var(--brand-amber); color:#0B0B0B; border-color:var(--line); }
.progress > span { background:var(--brand-amber); }
.fit.hi { color:var(--ink); box-shadow:inset 0 -0.4em 0 var(--brand-amber); }
:focus-visible { outline:2px solid var(--brand-amber); outline-offset:2px; }
.pill { border:1px solid var(--line-soft); }
.note.tone-warn, .callout.tone-warn, .weekcount.tone-warn { background:var(--accent-bg); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:1ms !important; }
}

/* Printed logs get submitted to agencies — make them read as a document. */
@media print {
  :root { --bg:#fff; --surface:#fff; --surface-2:#fff; --ink:#000; --ink-2:#222;
          --muted:#444; --line:#999; --line-soft:#ccc; }
  .topbar, .no-print, form.inline, .page-sub { display:none !important; }
  .print-only { display:inline !important; }
  body { font-size:10pt; background:#fff; }
  .wrap { max-width:none; padding:0; }
  .card { border:0; padding:0 0 10pt; margin:0 0 10pt; }
  .tablecard { border:1px solid #999; border-radius:0; }
  th, td { padding:5pt 6pt; font-size:9pt; }
  thead th { background:#eee !important; -webkit-print-color-adjust:exact; }
  tbody tr { break-inside:avoid; }
  select, input[type="text"] { display:none !important; }
  a { color:#000; text-decoration:none; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand"><span class="brand-name">🛩️ disqo jobs</span></span>
    <nav class="navlinks">
      <a href="/" class="{{ 'is-current' if nav == 'home' else '' }}">Today</a>
      <a href="/jobs" class="{{ 'is-current' if nav == 'queue' else '' }}">My jobs</a>
      <a href="/discover" class="{{ 'is-current' if nav == 'discover' else '' }}">Find jobs</a>
      <a href="/prep" class="{{ 'is-current' if nav == 'prep' else '' }}">Interview prep</a>
      <a href="/applied" class="{{ 'is-current' if nav == 'applied' else '' }}">Work search log</a>
      <a href="/data" class="{{ 'is-current' if nav == 'data' else '' }}">Your data</a>
    </nav>
    {% block toolbar %}{% endblock %}
    <button class="iconbtn" id="themeToggle" aria-label="Toggle light or dark theme">
      <svg id="themeIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.5" aria-hidden="true"></svg>
    </button>
  </div>
</header>
<div class="wrap">{% block content %}{% endblock %}</div>
<script>
// Theme: same contract as the prep page — follow the system, remember an override.
(function () {
  var SUN = '<circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/>';
  var MOON = '<path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.9 5.9 0 1 0 7.1 7.1z"/>';
  var KEY = "jobpilot-theme", store;
  try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); store = localStorage; }
  catch (e) { store = { getItem: function () { return null; }, setItem: function () {} }; }
  function apply(t) {
    document.documentElement.dataset.theme = t;
    document.getElementById("themeIcon").innerHTML = t === "dark" ? MOON : SUN;
  }
  apply(store.getItem(KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    store.setItem(KEY, next); apply(next);
  });
})();
</script>
<script>
// Click a column header to sort. Client-side so it composes with the search
// filter and doesn't cost a round trip; hidden rows stay hidden.
(function () {
  function cellKey(row, index) {
    var cell = row.cells[index];
    if (!cell) return "";
    return cell.dataset.key !== undefined ? cell.dataset.key : cell.textContent.trim();
  }

  function compare(kind) {
    return function (a, b) {
      if (kind === "num") {
        var na = parseFloat(a.key), nb = parseFloat(b.key);
        var aNaN = isNaN(na), bNaN = isNaN(nb);
        if (aNaN && bNaN) return 0;
        if (aNaN) return 1;            // blanks always last, either direction
        if (bNaN) return -1;
        return na - nb;
      }
      return a.key.localeCompare(b.key, undefined, { numeric: true, sensitivity: "base" });
    };
  }

  function wire(table) {
    var body = table.tBodies[0];
    if (!body) return;
    var headers = [].slice.call(table.tHead ? table.tHead.rows[0].cells : []);
    var storeKey = "sort:" + (table.id || "table");

    function sortBy(index, dir, remember) {
      var kind = headers[index].dataset.sort || "text";
      var rows = [].slice.call(body.rows).map(function (row, i) {
        return { row: row, key: cellKey(row, index), i: i };
      });
      var cmp = compare(kind);
      rows.sort(function (a, b) {
        var r = cmp(a, b);
        return (r || a.i - b.i) * (dir === "desc" ? -1 : 1);
      });
      rows.forEach(function (entry) { body.appendChild(entry.row); });
      headers.forEach(function (th, i) {
        if (!th.dataset.sort) return;
        th.setAttribute("aria-sort", i === index ? (dir === "desc" ? "descending" : "ascending") : "none");
      });
      if (remember) { try { sessionStorage.setItem(storeKey, index + ":" + dir); } catch (e) {} }
    }

    headers.forEach(function (th, index) {
      if (!th.dataset.sort) return;
      th.tabIndex = 0;
      th.setAttribute("role", "button");
      th.setAttribute("aria-sort", "none");
      function activate() {
        var current = th.getAttribute("aria-sort");
        // Numbers and dates are most useful highest-first on the first click.
        var first = (th.dataset.sort === "num" || th.dataset.sort === "date") ? "desc" : "asc";
        var dir = current === "none" ? first : (current === "ascending" ? "desc" : "asc");
        sortBy(index, dir, true);
      }
      th.addEventListener("click", activate);
      th.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
      });
    });

    try {
      var saved = sessionStorage.getItem(storeKey);
      if (saved) {
        var bits = saved.split(":");
        if (headers[bits[0]] && headers[bits[0]].dataset.sort) sortBy(+bits[0], bits[1], false);
      }
    } catch (e) {}
  }

  document.querySelectorAll("table.sortable").forEach(wire);
})();
</script>
<script>
// Tailoring and applying take tens of seconds. Without feedback people click twice.
document.addEventListener("submit", function (e) {
  var form = e.target;
  if (!/\/(tailor|prep|launch|mark-applied)$/.test(form.getAttribute("action") || "")) return;
  var btn = form.querySelector("button[type=submit], button:not([type])");
  if (!btn || btn.dataset.busy) return;
  btn.dataset.busy = "1";
  btn.dataset.label = btn.textContent;
  btn.textContent = "Working…";
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
