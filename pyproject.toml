[project]
name = "jobpilot"
version = "0.1.0"
description = "AI job-application assistant: discover, fit-score, tailor, assisted-apply, and log jobs."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eric Disque" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=62",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "playwright>=1.44",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
disqo-jobs = "jobpilot.cli:app"
# kept so existing installs and scripts keep working
jobpilot = "jobpilot.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpilot"]
